name: Auto Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间早上 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          target_sync_branch: main # 如果你的主分支是 master，请改为 master
          upstream_sync_repo: original-author/moontv # 替换为原作者的 GitHub 路径 (如：原作者ID/仓库名)
          upstream_sync_branch: main
